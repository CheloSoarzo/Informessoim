<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mu:#5d6672;--bd:#d5d9df;--ac:#1d5fd6;--act:#fff;--er:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1d2127;--tx:#eceff3;--mu:#9aa4b0;--bd:#343b44;--ac:#5b93f5;--act:#0b1220;--er:#ff7b6b}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1d2127;--tx:#eceff3;--mu:#9aa4b0;--bd:#343b44;--ac:#5b93f5;--act:#0b1220;--er:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0 12px}
.hd{display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin-bottom:12px;color:#0b3a8f}
.hd img{height:48px;width:auto}
.hd b{font-size:1.15rem;letter-spacing:.03em}.hd span{font-size:.85rem;color:#1a8f8a}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin:0 0 10px}
[hidden]{display:none!important}
.fx{margin-top:10px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
label.btn{display:block;text-align:center;border:1px solid var(--bd);border-radius:10px;padding:12px;color:var(--tx);margin:0;cursor:pointer;background:var(--bg)}
#pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ph{display:flex;flex-direction:column;gap:6px}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
.ph input{padding:7px;font-size:.85rem}
.ck{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--bd);margin:0;color:var(--tx);font-size:1rem}
.ck input{width:22px;height:22px;flex:none;padding:0;margin:0}
.fx label{margin-top:0}
label{display:block;font-size:.85rem;color:var(--mu);margin:10px 0 4px}
label:first-of-type{margin-top:0}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sig{border:1.5px dashed var(--bd);border-radius:8px;background:#fff;touch-action:none;width:100%;height:150px;display:block}
.sigbar{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:.85rem;color:var(--mu)}
button{font:inherit;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:11px 14px;cursor:pointer}
button.p{background:var(--ac);color:var(--act);border-color:var(--ac);font-weight:600;width:100%;padding:14px}
button.s{padding:6px 10px;font-size:.85rem}
#msg{margin:8px 0;font-size:.9rem;min-height:1.2em}
.err{color:var(--er)}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.item:first-child{border-top:0}
.item small{color:var(--mu);display:block}
</style>
</head>

<div style="height:8px"></div>

<div style="height:8px"></div>
<button id="save" style="width:100%">Guardar borrador en este dispositivo</button>

<div class="card" style="margin-top:16px"><h2>Informes guardados</h2><div id="list"><small style="color:var(--mu)">Ninguno todavía</small></div></div>
</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var F=['cliente','dir','fecha','tipo','ini','fin','tec','eq','prob','trab','mat','ncli'];
$('fecha').value=new Date().toISOString().slice(0,10);

// Dirección automática según cliente (editable)
var ADDR={
'Hospital base osorno':'Guillermo Buhler 18732, Osorno'
};
var lastAuto='';
$('cliente').onchange=function(){
  var a=ADDR[this.value]||'',d=$('dir');
  if(!d.value.trim()||d.value===lastAuto)d.value=a;
  lastAuto=a;
};

// Campos condicionales: if:[campo,valor] => se muestra solo si campo==valor
var SN=['No','Sí'];
var EQ={
'Tomógrafo':[
 {k:'Marca / modelo',t:'text'},{k:'N° de serie',t:'text'},
 {k:'Cortes (slices)',t:'sel',o:['16','32','64','128','256 o más']},
 {k:'Contador de exploraciones',t:'num'},{k:'Horas del tubo de rayos X',t:'num'},
 {k:'Calibración de aire',t:'sel',o:['No realizada','OK','Fallida']},
 {k:'Control de calidad con fantoma',t:'sel',o:['No realizado','Aprobado','No aprobado']},
 {k:'Detalle del fallo del fantoma',t:'text',if:['Control de calidad con fantoma','No aprobado']},
 {k:'Temperatura de sala (°C)',t:'num'},
 {k:'¿Se reemplazó el tubo?',t:'sel',o:SN},
 {k:'N° de serie del tubo nuevo',t:'text',if:['¿Se reemplazó el tubo?','Sí']}],
'Resonancia magnética':[
 {k:'Marca / modelo',t:'text'},{k:'N° de serie',t:'text'},
 {k:'Campo magnético',t:'sel',o:['1.5 T','3 T','Otro']},
 {k:'Nivel de helio (%)',t:'num'},{k:'Chiller funcionando',t:'sel',o:SN},
 {k:'¿Se hizo quench?',t:'sel',o:SN},
 {k:'Detalle del quench',t:'text',if:['¿Se hizo quench?','Sí']}],
'Rayos X':[
 {k:'Marca / modelo',t:'text'},{k:'N° de serie',t:'text'},
 {k:'kV medido',t:'num'},{k:'mAs medido',t:'num'},
 {k:'Prueba de colimador',t:'sel',o:['OK','Fuera de tolerancia']}],
'Ecógrafo':[
 {k:'Marca / modelo',t:'text'},{k:'N° de serie',t:'text'},
 {k:'¿Falla en transductor?',t:'sel',o:SN},
 {k:'Transductor afectado',t:'text',if:['¿Falla en transductor?','Sí']}],
'Otro':[{k:'Marca / modelo',t:'text'},{k:'N° de serie',t:'text'}]
};
var SV={
'Reparación':[
 {k:'Código de error',t:'text'},
 {k:'¿Equipo fuera de servicio?',t:'sel',o:SN},
 {k:'Horas fuera de servicio',t:'num',if:['¿Equipo fuera de servicio?','Sí']}],
'Instalación':[{k:'N° de acta de entrega',t:'text'}],
'Inspección':[
 {k:'Resultado',t:'sel',o:['Conforme','Con observaciones']},
 {k:'Observaciones',t:'text',if:['Resultado','Con observaciones']}]
};
var X={},cur={eq:[],sv:[]};
function mk(box,list){
  box.textContent='';var rows=[];
  function upd(){rows.forEach(function(r){var c=r.f.if;r.w.hidden=!!(c&&X[c[0]]!==c[1])})}
  list.forEach(function(f){
    var w=document.createElement('div');w.className='fx';
    var l=document.createElement('label');l.textContent=f.k;
    var i;
    if(f.t==='sel'){
      i=document.createElement('select');
      var z=document.createElement('option');z.value='';z.textContent='—';i.appendChild(z);
      f.o.forEach(function(v){var o=document.createElement('option');o.textContent=v;i.appendChild(o)});
    }else{i=document.createElement('input');i.type=f.t==='num'?'number':'text';if(f.t==='num')i.inputMode='decimal'}
    i.value=X[f.k]||'';
    i.oninput=i.onchange=function(){X[f.k]=i.value;upd()};
    w.appendChild(l);w.appendChild(i);box.appendChild(w);rows.push({f:f,w:w});
  });
  upd();return rows;
}
var CK={
'general':['Inspección visual del equipo','Limpieza del equipo','Pruebas de funcionamiento','Equipo entregado operativo'],
'Tomógrafo':['Revisión del tubo de rayos X','Calibración de aire','Control de calidad con fantoma','Revisión de gantry y mesa','Revisión de refrigeración','Respaldo de configuración'],
'Resonancia magnética':['Revisión de nivel de helio','Revisión del chiller','Revisión de bobinas','Revisión de sala RF'],
'Rayos X':['Verificación de kV y mAs','Prueba de colimador','Revisión de cables y conectores'],
'Ecógrafo':['Revisión de transductores','Limpieza de filtros','Prueba de imagen'],
'Otro':[]};
var C={},CU=[];
function ckItems(){return CK.general.concat(CK[$('eq').value]||[],CU)}
function renderCk(){
  var b=$('chk');b.textContent='';
  ckItems().forEach(function(t){
    var l=document.createElement('label');l.className='ck';
    var i=document.createElement('input');i.type='checkbox';i.checked=!!C[t];
    i.onchange=function(){C[t]=i.checked?1:0};
    var sp=document.createElement('span');sp.textContent=t;
    l.appendChild(i);l.appendChild(sp);b.appendChild(l);
  });
}
$('cadd').onclick=function(){
  var v=$('cnew').value.trim();if(!v||ckItems().indexOf(v)>-1)return;
  CU.push(v);C[v]=1;$('cnew').value='';renderCk();
};
function refresh(){cur.eq=mk($('eqbox'),EQ[$('eq').value]||[]);cur.sv=mk($('svbox'),SV[$('tipo').value]||[]);renderCk()}
function extras(){
  var o=[];cur.eq.concat(cur.sv).forEach(function(r){if(!r.w.hidden&&X[r.f.k])o.push([r.f.k,X[r.f.k]])});return o;
}
$('eq').onchange=refresh;$('tipo').onchange=refresh;refresh();

// Signature pads
var pads={};
function pad(id){
  var c=$(id),ctx=c.getContext('2d'),dirty=false,drawing=false,last=null;
  var r=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
  c.width=w*r;c.height=h*r;ctx.scale(r,r);
  ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';
  function pt(e){var b=c.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}}
  c.addEventListener('pointerdown',function(e){e.preventDefault();c.setPointerCapture(e.pointerId);drawing=true;last=pt(e);ctx.beginPath();ctx.arc(last.x,last.y,1.2,0,7);ctx.fill();dirty=true});
  c.addEventListener('pointermove',function(e){if(!drawing)return;e.preventDefault();var p=pt(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});
  ['pointerup','pointercancel','pointerleave'].forEach(function(t){c.addEventListener(t,function(){drawing=false})});
  pads[id]={empty:function(){return !dirty},img:function(){return c.toDataURL('image/png')},
    clear:function(){ctx.clearRect(0,0,w,h);dirty=false},
    load:function(d){if(!d)return;var im=new Image();im.onload=function(){ctx.drawImage(im,0,0,w,h);dirty=true};im.src=d}};
}
pad('s1');pad('s2');
document.querySelectorAll('[data-clear]').forEach(function(b){b.onclick=function(){pads[b.dataset.clear].clear()}});

function say(t,bad){var m=$('msg');m.textContent=t;m.className=bad?'err':''}
function data(){var o={};F.forEach(function(k){o[k]=$(k).value.trim()});o.x=extras();o.cu=CU.slice();o.ph=P;o.ck=ckItems().map(function(t){return [t,C[t]?1:0]});return o}

// Fotos
var P=[];
function renderPh(){
  var g=$('pgrid');g.textContent='';
  P.forEach(function(p,i){
    var w=document.createElement('div');w.className='ph';
    var im=document.createElement('img');im.src=p.d;
    var c=document.createElement('input');c.placeholder='Descripción (opcional)';c.value=p.c||'';c.oninput=function(){p.c=c.value};
    var b=document.createElement('button');b.type='button';b.className='s';b.textContent='Quitar';b.onclick=function(){P.splice(i,1);renderPh()};
    w.appendChild(im);w.appendChild(c);w.appendChild(b);g.appendChild(w);
  });
  $('pcount').textContent=P.length?'('+P.length+')':'';
}
function fit(file){return new Promise(function(res){
  var fr=new FileReader();
  fr.onload=function(){var im=new Image();
    im.onload=function(){
      var k=Math.min(1,1000/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k);
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      var x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      res({d:cv.toDataURL('image/jpeg',.72),w:w,h:h,c:''});
    };
    im.onerror=function(){res(null)};im.src=fr.result};
  fr.onerror=function(){res(null)};fr.readAsDataURL(file);
})}
$('pfile').onchange=async function(){
  var fs=Array.prototype.slice.call(this.files);this.value='';
  for(var i=0;i<fs.length;i++){
    if(P.length>=12){say('Máximo 12 fotos.',1);break}
    var r=await fit(fs[i]);if(r)P.push(r);
  }
  renderPh();
};
renderPh();

// Storage (per-device draft list)
var KEY='informes-servicio-v1';
function readAll(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function writeAll(a){try{localStorage.setItem(KEY,JSON.stringify(a));return true}catch(e){return false}}
function render(){
  var a=readAll(),L=$('list');L.textContent='';
  if(!a.length){L.innerHTML='<small style="color:var(--mu)">Ninguno todavía</small>';return}
  a.slice().reverse().forEach(function(r){
    var d=document.createElement('div');d.className='item';
    var t=document.createElement('div');t.textContent=r.d.cliente||'(sin cliente)';
    var s=document.createElement('small');s.textContent=(r.d.fecha||'')+' · '+(r.d.tipo||'');t.appendChild(s);
    var bs=document.createElement('div');
    var o=document.createElement('button');o.className='s';o.textContent='Abrir';o.onclick=function(){open_(r)};
    var x=document.createElement('button');x.className='s';x.textContent='✕';x.style.marginLeft='6px';x.onclick=function(){writeAll(readAll().filter(function(q){return q.id!==r.id}));render()};
    bs.appendChild(o);bs.appendChild(x);d.appendChild(t);d.appendChild(bs);L.appendChild(d);
  });
}
function open_(r){F.forEach(function(k){$(k).value=r.d[k]||''});X={};(r.d.x||[]).forEach(function(p){X[p[0]]=p[1]});P=(r.d.ph||[]).slice();renderPh();C={};CU=(r.d.cu||[]).slice();(r.d.ck||[]).forEach(function(p){C[p[0]]=p[1]});refresh();pads.s1.clear();pads.s2.clear();pads.s1.load(r.s1);pads.s2.load(r.s2);lastAuto='';window.scrollTo(0,0);say('Informe cargado.')}
$('save').onclick=function(){
  var d=data();if(!d.cliente){say('Escriba el nombre del cliente.',1);return}
  var a=readAll();
  a.push({id:Date.now(),d:d,s1:pads.s1.empty()?null:pads.s1.img(),s2:pads.s2.empty()?null:pads.s2.img()});
  var ok=writeAll(a);say(ok?'Borrador guardado en este dispositivo.':'No se pudo guardar (quizá hay demasiadas fotos). Exporte el PDF.',!ok);render();
};
render();

// PDF
function build(d){
  var J=window.jspdf.jsPDF,doc=new J({unit:'mm',format:'a4'}),W=210,M=16,y=M,TW=W-2*M;
  var LH=14,LW=LH*520/154;doc.addImage(document.getElementById('logo').src,'PNG',(W-LW)/2,y,LW,LH);
  doc.setFont('helvetica','bold');doc.setFontSize(17);doc.setTextColor(11,58,143);doc.text('Informe de servicio',W/2,y+LH+7,{align:'center'});
  y+=LH+11;
  doc.setDrawColor(29,95,214);doc.setLineWidth(.6);doc.line(M,y,W-M,y);y+=7;
  function pair(a,b,x){doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(100);doc.text(a.toUpperCase(),x,y);
    doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(20);doc.text(doc.splitTextToSize(b||'-',TW/2-4),x,y+5)}
  pair('Cliente',d.cliente,M);pair('Fecha',d.fecha,M+TW/2);y+=14;
  pair('Dirección',d.dir,M);pair('Tipo',d.tipo,M+TW/2);y+=14;
  pair('Técnico',d.tec,M);pair('Horario',(d.ini||'-')+' a '+(d.fin||'-'),M+TW/2);y+=16;
  function block(t,txt){
    doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(29,95,214);doc.text(t.toUpperCase(),M,y);y+=5;
    doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(20);
    var ls=doc.splitTextToSize(txt||'-',TW);
    ls.forEach(function(l){if(y>255){doc.addPage();y=M}doc.text(l,M,y);y+=5.2});y+=5}
  if(d.eq||d.x.length)block('Equipo y detalles',(d.eq?'Equipo: '+d.eq+'\n':'')+d.x.map(function(p){return p[0]+': '+p[1]}).join('\n'));
  block('Problema reportado',d.prob);if(d.ck.length){
    doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(29,95,214);doc.text('CHECKLIST DE TAREAS',M,y);y+=6;
    doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.setTextColor(20);
    d.ck.forEach(function(p){
      if(y>262){doc.addPage();y=M}
      doc.setDrawColor(90);doc.setLineWidth(.3);doc.rect(M,y-3.2,3.4,3.4);
      if(p[1]){doc.setDrawColor(29,95,214);doc.setLineWidth(.6);doc.line(M+.7,y-1.4,M+1.6,y-.3);doc.line(M+1.6,y-.3,M+2.9,y-2.7)}
      doc.text(doc.splitTextToSize(p[0],TW-8)[0],M+6,y);y+=5.6;
    });y+=4;
  }
  block('Detalle del trabajo realizado',d.trab);block('Materiales / repuestos',d.mat);
  if(y>205){doc.addPage();y=M}
  y=Math.max(y,215);
  function sig(p,label,x){
    doc.setDrawColor(150);doc.setLineWidth(.3);doc.line(x,y+28,x+TW/2-8,y+28);
    if(!p.empty())doc.addImage(p.img(),'PNG',x,y,TW/2-8,27);
    doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(90);doc.text(label,x,y+33)}
  sig(pads.s1,'Técnico: '+(d.tec||''),M);sig(pads.s2,'Cliente: '+(d.ncli||''),M+TW/2+4);
  if(d.ph&&d.ph.length){
    doc.addPage();var py=M,CW=86,CH=62;
    doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(29,95,214);doc.text('REGISTRO FOTOGRÁFICO',M,py+4);py+=12;
    d.ph.forEach(function(p,i){
      var col=i%2;
      if(col===0&&i>0){py+=CH+14;if(py+CH+8>276){doc.addPage();py=M}}
      var x=M+col*(CW+6),k=Math.min(CW/p.w,CH/p.h),iw=p.w*k,ih=p.h*k;
      doc.setDrawColor(210);doc.setLineWidth(.2);doc.rect(x,py,CW,CH);
      doc.addImage(p.d,'JPEG',x+(CW-iw)/2,py+(CH-ih)/2,iw,ih);
      doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(60);
      doc.text(doc.splitTextToSize((i+1)+'. '+(p.c||''),CW).slice(0,2),x,py+CH+4);
    });
  }
  var n=doc.getNumberOfPages();
  for(var i=1;i<=n;i++){
    doc.setPage(i);doc.setDrawColor(190);doc.setLineWidth(.3);doc.line(M,281,W-M,281);
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(60);
    doc.text('Soarzo y Soarzo Limitada',W/2,286,{align:'center'});
    doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(100);
    doc.text('RUT 77.000.218-4  ·  Valdes Vergara 451, Viña del Mar',W/2,290.5,{align:'center'});
    if(n>1)doc.text(i+' / '+n,W-M,290.5,{align:'right'});
  }
  return doc;
}
async function makePdf(){
  var d=data();
  if(!d.cliente){say('Seleccione el cliente.',1);return null}
  if(pads.s1.empty()||pads.s2.empty()){say('Faltan las firmas del técnico y del cliente.',1);return null}
  if(!window.jspdf){say('No se cargó el generador de PDF. Conéctese a internet una vez y reintente.',1);return null}
  try{
    var buf=build(d).output('arraybuffer');
    return{blob:new Blob([buf],{type:'application/pdf'}),name:d.fecha+'_'+d.cliente.replace(/[^\w\-]+/g,'_')+'.pdf'};
  }catch(e){say('Error al generar el PDF: '+(e&&e.message||e),1);return null}
}
$('pdf').onclick=async function(){
  var r=await makePdf();if(!r)return;
  try{
    var u=URL.createObjectURL(r.blob),a=document.createElement('a');
    a.href=u;a.download=r.name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},60000);
    say('PDF descargado: '+r.name);
  }catch(e){say('No se pudo descargar: '+(e&&e.message||e),1)}
};
try{if(navigator.canShare&&navigator.canShare({files:[new File([''],'a.pdf',{type:'application/pdf'})]}))$('share').hidden=false}catch(e){}
$('share').onclick=async function(){
  var r=await makePdf();if(!r)return;
  try{await navigator.share({files:[new File([r.blob],r.name,{type:'application/pdf'})],title:r.name});say('PDF compartido.')}
  catch(e){say(e&&e.name==='AbortError'?'Cancelado.':'No se pudo compartir: '+(e&&e.message||e),1)}
};
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
</body>
</html>
